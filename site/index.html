<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="https://use.typekit.net/lma8nsi.css" />
    <link rel="canonical" href="https://countdown.lara.lv/" />
    <script type="module" src="script.js"></script>
  </head>
  <body>
    <div class="countdown">
      <span id="weeks">0</span>&nbsp;<span id="weeks-label"></span>&nbsp;<span
        id="days"
        >0</span
      >&nbsp;<span id="days-label"></span><br />
      <span id="hours"></span>:<span id="minutes"></span>:<span
        id="seconds"
      ></span>
    </div>

    <div class="percentage">
      <span id="percent-start"></span><span id="percentage"></span
      ><span id="percent-end"></span>
    </div>
  </body>
</html>
